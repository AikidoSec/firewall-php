    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.2', '8.3', '8.4', '8.5']
        server: [frankenphp-worker, frankenphp-classic]
        arch: ['', '-arm']

    # JavaScript actions run on Ubuntu because Alpine ARM job containers do not
    # support them. The FrankenPHP tests still run inside the Alpine image.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Get package details
        run: |
          ARCH=$(uname -m)
          echo "APK_NAME=aikido-php-firewall.${ARCH}.apk" >> "$GITHUB_ENV"
          AIKIDO_VERSION=$(awk -F= '/^pkgver=/ { print $2 }' package/apk/APKBUILD)
          echo "AIKIDO_VERSION=${AIKIDO_VERSION}" >> "$GITHUB_ENV"

      - name: Download APK
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: ${{ env.APK_NAME }}
          path: package-input

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Alpine FrankenPHP tests
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php_version }}
          SERVER: ${{ matrix.server }}
        run: |
          docker run --rm --privileged --interactive \
            --env AIKIDO_LOG_LEVEL \
            --env AIKIDO_VERSION \
            --env APK_NAME \
            --env EXPECTED_PHP_VERSION \
            --env SERVER \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work \
            "${TEST_IMAGE}" bash -euo pipefail <<'BASH'
              FRANKENPHP_INFO="$(frankenphp -v)"
              grep -q "PHP ${EXPECTED_PHP_VERSION}" <<< "${FRANKENPHP_INFO}"
              PHP_INFO="$(php -v)"
              grep -q ZTS <<< "${PHP_INFO}"
              PHP_MODULES="$(php -m)"
              grep -qi "^mysqli$" <<< "${PHP_MODULES}"

              start-mariadb >/tmp/mariadb.log 2>&1 &
              MARIADB_READY=0
              for _ in $(seq 1 30); do
                if mysql -h 127.0.0.1 -u root -ppwd -e "SELECT 1"; then
                  MARIADB_READY=1
                  break
                fi
                sleep 1
              done
              if [ "${MARIADB_READY}" -ne 1 ]; then
                cat /tmp/mariadb.log
                exit 1
              fi

              apk add --allow-untrusted "package-input/${APK_NAME}"
              test -L /usr/lib/frankenphp/modules/aikido-*.so
              test -L /etc/frankenphp/php.d/zz-aikido-*.ini
              printf '%s\n' '<?php exit(extension_loaded("aikido") ? 0 : 1);' > /tmp/check-aikido.php
              frankenphp php-cli /tmp/check-aikido.php

              cd tools
              python3 run_server_tests.py ../tests/server ../tests/testlib \
                --server="${SERVER}" --max-runs=3
              cd ..

              apk del aikido-php-firewall
              ! find /usr/lib/frankenphp/modules -name "aikido-*.so" -type l | grep -q .
              ! find /etc/frankenphp/php.d -name "zz-aikido-*.ini" -type l | grep -q .
              test ! -e "/run/aikido-${AIKIDO_VERSION}"
              test ! -e "/var/log/aikido-${AIKIDO_VERSION}"
          BASH

  test_php_centos:
    name: CentOS NTS php-${{ matrix.php_version }} ${{ matrix.server }} ${{ matrix.arch == '' && 'x86_64' || 'arm' }}
    runs-on: ubuntu-24.04${{ matrix.arch }}
    container:
      image: ghcr.io/aikidosec/firewall-php-test-centos-nts:${{ matrix.php_version }}-v3
      options: --privileged
    needs: [ build_rpm ]
    strategy:
      matrix:
        php_version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        server: ['nginx-php-fpm', 'apache-mod-php', 'php-built-in']
        arch: ['', '-arm']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        run: |
          uname -a
          cat /etc/centos-release
          php -v
          httpd -v || true
          nginx -v || true
          which php-fpm && php-fpm -v || true
          rpm -qa | grep -E '^php(-|$)' | sort

      - name: Install and start MySQL
        run: |
          mkdir -p /var/lib/mysql
          mysqld --initialize-insecure --datadir=/var/lib/mysql
          mysqld -u root --datadir=/var/lib/mysql --socket=/var/lib/mysql/mysql.sock &
          sleep 10
          mysql -u root -e "CREATE DATABASE IF NOT EXISTS db;"
          mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'pwd'; FLUSH PRIVILEGES;"

      - name: Test MySQL connection with mysqli
        run: |
          php -r '
            $mysqli = new mysqli("localhost", "root", "pwd", "db");
            if ($mysqli->connect_error) {
              echo "MySQL connection failed: " . $mysqli->connect_error . "\n";
              exit(1);
            } else {
              echo "MySQL connection successful\n";
              $mysqli->close();
            }
          '

      - name: Install and start PostgreSQL
        run: |
          mkdir -p /var/lib/pgsql/data /var/run/postgresql
          chown -R postgres:postgres /var/lib/pgsql /var/run/postgresql
          su postgres -c "initdb -D /var/lib/pgsql/data"
          su postgres -c "pg_ctl -D /var/lib/pgsql/data -l /tmp/postgres.log -o '-p 5432' start"
          sleep 5
          su postgres -c "psql -p 5432 -c \"ALTER USER postgres PASSWORD 'postgres';\""
          su postgres -c "psql -p 5432 -c 'CREATE DATABASE zen_test;'"

      - name: Test PostgreSQL connection with pgsql
        run: |
          php -r '
            $db = pg_connect("host=127.0.0.1 port=5432 dbname=zen_test user=postgres password=postgres");
            if (!$db) {
              echo "PostgreSQL connection failed\n";
              exit(1);
            } else {
              echo "PostgreSQL connection successful\n";
              pg_close($db);
            }
          '

      - name: Get Arch
        run: echo "ARCH=$(uname -m)" >> $GITHUB_ENV

      - name: Check PHP setup
        run: |
          uname -m
          php -v
          php -i

      - name: Get Aikido version
        run: |
          AIKIDO_VERSION=$(grep '#define PHP_AIKIDO_VERSION' lib/php-extension/include/php_aikido.h | awk -F'"' '{print $2}')
          echo $AIKIDO_VERSION
          echo "AIKIDO_VERSION=$AIKIDO_VERSION" >> $GITHUB_ENV
          echo "AIKIDO_RPM=aikido-php-firewall.${{ env.ARCH }}.rpm" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: |
            ${{ env.AIKIDO_RPM }}

      - name: Install RPM
        run: |
          rpm -Uvh --oldpackage ${{ env.AIKIDO_RPM }}/${{ env.AIKIDO_RPM }}

      - name: Run CLI tests
        run: |
          export TEST_PHP_EXECUTABLE=/usr/bin/php
          cd lib/php-extension/
          phpize
          cd ../../
          php lib/php-extension/run-tests.php ./tests/cli

      - name: Run ${{ matrix.server }} server tests
        run: |
          cd tools
          python3 run_server_tests.py ../tests/server ../tests/testlib --server=${{ matrix.server }} --max-runs=3

  test_php_ubuntu:
    name: Ubuntu NTS php-${{ matrix.php_version }} ${{ matrix.server }} ${{ matrix.arch == '' && 'x86_64' || 'arm' }}
    runs-on: ubuntu-24.04${{ matrix.arch }}
    container:
      image: ghcr.io/aikidosec/firewall-php-test-ubuntu-nts:${{ matrix.php_version }}-v3
