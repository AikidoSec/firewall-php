name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  build_libs:
    name: Build Go libs ${{ matrix.arch == '' && 'x86_64' || 'arm' }}
    runs-on: ubuntu-24.04${{ matrix.arch }}
    container:
      image: ghcr.io/aikidosec/firewall-php-build-libs:v1
    strategy:
      matrix:
        arch: [ '', '-arm' ]
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

    - name: Get Arch
      run: echo "ARCH=$(uname -m)" >> $GITHUB_ENV

    - name: Get Aikido version
      run: |
        AIKIDO_VERSION=$(grep '#define PHP_AIKIDO_VERSION' lib/php-extension/include/php_aikido.h | awk -F'"' '{print $2}')
        echo $AIKIDO_VERSION
        echo "AIKIDO_VERSION=$AIKIDO_VERSION" >> $GITHUB_ENV
        echo "AIKIDO_INTERNALS_REPO=https://api.github.com/repos/AikidoSec/zen-internals" >> $GITHUB_ENV

    - name: Build Aikido Agent
      run: |
        cd lib
        protoc --go_out=agent --go-grpc_out=agent ipc.proto
        cd agent
        go get main/ipc/protos
        go get google.golang.org/grpc
        go get github.com/stretchr/testify/assert
        go test ./...
        go build -buildvcs=false -ldflags "-s -w" -o ../../build/aikido-agent
        ls -l ../../build


    - name: Build Aikido Request Processor
      run: |
        cd lib
        protoc --go_out=request-processor --go-grpc_out=request-processor ipc.proto
        cd request-processor
        go mod tidy
        go get google.golang.org/grpc
        go get github.com/stretchr/testify/assert
        go get main/ipc/protos
        go test ./...
        go build -ldflags "-s -w" -buildmode=c-shared -o ../../build/aikido-request-processor.so
        ls -l ../../build

    - name: Archive agent
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
      if: always()
      with:
        name: aikido-agent-${{ env.ARCH }}
        if-no-files-found: error
        path: |
          ${{ github.workspace }}/build/aikido-agent

    - name: Archive request processor
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: aikido-request-processor-${{ env.ARCH }}
        if-no-files-found: error
        path: |
          ${{ github.workspace }}/build/aikido-request-processor.so

  build_php_extension_nts:
    name: Build php ${{ matrix.php_version }} extension NTS ${{ matrix.arch == '' && 'x86_64' || 'arm' }}
    runs-on: ubuntu-24.04${{ matrix.arch }}
    container: ghcr.io/aikidosec/firewall-php-build-extension-nts:${{ matrix.php_version }}-v2
    strategy:
      matrix:
        php_version: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        arch: [ '', '-arm' ]
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get Arch
      run: echo "ARCH=$(uname -m)" >> $GITHUB_ENV

    - name: Get Aikido version
      run: |
        AIKIDO_VERSION=$(grep '#define PHP_AIKIDO_VERSION' lib/php-extension/include/php_aikido.h | awk -F'"' '{print $2}')
        echo $AIKIDO_VERSION
        echo "AIKIDO_VERSION=$AIKIDO_VERSION" >> $GITHUB_ENV
        echo "AIKIDO_ARTIFACT=aikido-extension-php-${{ matrix.php_version }}" >> $GITHUB_ENV

    - name: Check PHP setup
      run: |
        php -v | grep -v "ZTS" > /dev/null || (echo "ERROR: PHP is ZTS, expected NTS!" && php -v && exit 1)


    - name: Build extension
      run: |
        rm -rf build
        mkdir build
        cd lib/php-extension
        phpize
        cd ../../build
        CXX=g++ CXXFLAGS="-fPIC -g -O2 -I../lib/php-extension/include" LDFLAGS="-lstdc++" ../lib/php-extension/configure
        make -j"$(nproc)"

    - name: Version Aikido extension
      run: |
        cd ./build/modules
        mv aikido.so ${{ env.AIKIDO_ARTIFACT }}-nts.so

    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ env.AIKIDO_ARTIFACT }}-nts-${{ env.ARCH }}
        if-no-files-found: error
        path: |
          ${{ github.workspace }}/build/modules/${{ env.AIKIDO_ARTIFACT }}-nts.so
          ${{ github.workspace }}/tests/*.diff

  build_php_extension_zts:
    name: Build php ${{ matrix.php_version }} extension ZTS ${{ matrix.arch == '' && 'x86_64' || 'arm' }}
    runs-on: ubuntu-24.04${{ matrix.arch }}
    container: ghcr.io/aikidosec/firewall-php-build-extension-zts:${{ matrix.php_version }}-v2
    strategy:
      matrix:
        php_version: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        arch: [ '', '-arm' ]
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get Arch
      run: echo "ARCH=$(uname -m)" >> $GITHUB_ENV

    - name: Get Aikido version
      run: |
        AIKIDO_VERSION=$(grep '#define PHP_AIKIDO_VERSION' lib/php-extension/include/php_aikido.h | awk -F'"' '{print $2}')
        echo $AIKIDO_VERSION
        echo "AIKIDO_VERSION=$AIKIDO_VERSION" >> $GITHUB_ENV
        echo "AIKIDO_ARTIFACT=aikido-extension-php-${{ matrix.php_version }}" >> $GITHUB_ENV

    - name: Check PHP setup
      run: |
        php -v | grep -q "ZTS" || (echo "ERROR: PHP is not ZTS!" && php -v && exit 1)

    - name: Build extension
      run: |
        rm -rf build
        mkdir build
        cd lib/php-extension
        phpize
        cd ../../build
        CXX=g++ CXXFLAGS="-fPIC -g -O2 -I../lib/php-extension/include" LDFLAGS="-lstdc++" ../lib/php-extension/configure
        make -j"$(nproc)"

    - name: Version Aikido extension
      run: |
        cd ./build/modules
        mv aikido.so ${{ env.AIKIDO_ARTIFACT }}-zts.so

    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ env.AIKIDO_ARTIFACT }}-zts-${{ env.ARCH }}
        if-no-files-found: error
        path: |
          ${{ github.workspace }}/build/modules/${{ env.AIKIDO_ARTIFACT }}-zts.so
          ${{ github.workspace }}/tests/*.diff

  build_rpm:
    name: Build rpm ${{ matrix.arch == '' && 'x86_64' || 'arm' }}
    runs-on: ubuntu-24.04${{ matrix.arch }}
    container:
      image: quay.io/centos/centos:stream9
    strategy:
      matrix:
        arch: ['', '-arm']
      fail-fast: false
    needs: [ build_libs, build_php_extension_nts, build_php_extension_zts ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rpmdevtools
        run: |
          yum -y install epel-release
          yum -y install rpmdevtools
          yum -y install jq

      - name: Get Arch
        run: echo "ARCH=$(uname -m)" >> $GITHUB_ENV

      - name: Get Aikido version
        run: |
          AIKIDO_VERSION=$(grep '#define PHP_AIKIDO_VERSION' lib/php-extension/include/php_aikido.h | awk -F'"' '{print $2}')
          echo $AIKIDO_VERSION
          echo "AIKIDO_VERSION=$AIKIDO_VERSION" >> $GITHUB_ENV
          echo "AIKIDO_LIBZEN=libzen_internals_${{ env.ARCH }}-unknown-linux-gnu.so" >> $GITHUB_ENV
          echo "AIKIDO_LIBZEN_VERSION=0.1.64" >> $GITHUB_ENV

      - name: Download artifacts (NTS)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: |
            aikido-extension-php-*-nts-${{ env.ARCH }}

      - name: Download artifacts (ZTS)
        uses: actions/download-artifact@v4
        with:
          pattern: |
            aikido-extension-php-*-zts-${{ env.ARCH }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: |
            aikido-agent-${{ env.ARCH }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: |
            aikido-request-processor-${{ env.ARCH }}

      - name: Download Aikido Zen Internals Lib
        run: |
          curl -L -O https://github.com/AikidoSec/zen-internals/releases/download/v${{ env.AIKIDO_LIBZEN_VERSION }}/${{ env.AIKIDO_LIBZEN }}

      - name: Verify Aikido Zen Internals Lib SHA256
        run: |
          EXPECTED_SHA256=$(curl -s https://api.github.com/repos/AikidoSec/zen-internals/releases/tags/v${{ env.AIKIDO_LIBZEN_VERSION }} | jq -r '.assets[] | select(.name == "${{ env.AIKIDO_LIBZEN }}") | .digest' | sed 's/sha256://')
          ACTUAL_SHA256=$(sha256sum ${{ env.AIKIDO_LIBZEN }} | awk '{print $1}')
          echo "Expected SHA256: $EXPECTED_SHA256"
          echo "Actual SHA256:   $ACTUAL_SHA256"
          if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "SHA256 mismatch! Downloaded file may be corrupted or tampered with."
            exit 1
          fi
          echo "SHA256 verification passed!"

      - name: Prepare rpm package
        run: |
          mv aikido-agent-${{ env.ARCH }}/aikido-agent package/rpm/opt/aikido/aikido-agent
          mv aikido-request-processor-${{ env.ARCH }}/aikido-request-processor.so package/rpm/opt/aikido/aikido-request-processor.so
          mv ${{ env.AIKIDO_LIBZEN }} package/rpm/opt/aikido/${{ env.AIKIDO_LIBZEN }}
          # Copy NTS extensions
          for dir in aikido-extension-php-*-nts-*/; do
            if [ -d "$dir" ]; then
              find "$dir" -name "aikido-extension-php-*-nts.so" -exec mv {} package/rpm/opt/aikido/ \;
            fi
          done
          # Copy ZTS extensions
          for dir in aikido-extension-php-*-zts-*/; do
            if [ -d "$dir" ]; then
              find "$dir" -name "aikido-extension-php-*-zts.so" -exec mv {} package/rpm/opt/aikido/ \;
            fi
          done
          echo "Extensions in package:"
          ls -la package/rpm/opt/aikido/aikido-extension-php-*.so || true
          mv package/rpm/opt/aikido package/rpm/opt/aikido-${{ env.AIKIDO_VERSION }}
          chmod 777 package/rpm/opt/aikido-${{ env.AIKIDO_VERSION }}/*
          rpmdev-setuptree
          mkdir -p ~/rpmbuild/SOURCES/aikido-php-firewall-${{ env.AIKIDO_VERSION }}
          cp -rf package/rpm/opt ~/rpmbuild/SOURCES/aikido-php-firewall-${{ env.AIKIDO_VERSION }}/
          cp -f package/rpm/aikido.spec ~/rpmbuild/SPECS/

      - name: Setup RPM for prod
        run: |
          echo "AIKIDO_ARTIFACT=aikido-php-firewall-$AIKIDO_VERSION-1.${{ env.ARCH }}.rpm" >> $GITHUB_ENV
          echo "AIKIDO_ARTIFACT_RELEASE=aikido-php-firewall.${{ env.ARCH }}.rpm" >> $GITHUB_ENV
          sed -i "s/aikido.so/aikido-${{ env.AIKIDO_VERSION }}.so/" ~/rpmbuild/SOURCES/aikido-php-firewall-${{ env.AIKIDO_VERSION }}/opt/aikido-${{ env.AIKIDO_VERSION }}/aikido.ini

      - name: Build rpm package
        run: |
          cat /usr/lib/rpm/macros | grep level
          cd ~/rpmbuild/SOURCES
          tar czvf ~/rpmbuild/SOURCES/aikido-php-firewall-${{ env.AIKIDO_VERSION }}.tar.gz *
          rm -rf ~/rpmbuild/SOURCES/aikido-php-firewall-${{ env.AIKIDO_VERSION }}
          rpmbuild --define "_binary_payload w9.gzdio" --define "_source_payload w9.gzdio" -ba ~/rpmbuild/SPECS/aikido.spec
          ls -l ~/rpmbuild/RPMS/${{ env.ARCH }}/
          mv ~/rpmbuild/RPMS/${{ env.ARCH }}/${{ env.AIKIDO_ARTIFACT }} ~/rpmbuild/RPMS/${{ env.ARCH }}/${{ env.AIKIDO_ARTIFACT_RELEASE }}

      - name: Check rpm dependencies
        run: |
          yum deplist ~/rpmbuild/RPMS/${{ env.ARCH }}/${{ env.AIKIDO_ARTIFACT_RELEASE }} | grep -E "GLIBC_2.32|GLIBC_2.34|GLIBCXX_3.4.26|GLIBCXX_3.4.29" && exit 1 || exit 0

      - name: Archive rpm package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AIKIDO_ARTIFACT_RELEASE }}
          if-no-files-found: error
          path: |
            ~/rpmbuild/RPMS/${{ env.ARCH }}/${{ env.AIKIDO_ARTIFACT_RELEASE }}

  build_deb:
    name: Build deb ${{ matrix.arch == '' && 'x86_64' || 'arm' }}
    runs-on: ubuntu-24.04${{ matrix.arch }}
    container:
      image: ubuntu:22.04
    strategy:
      matrix:
        arch: [ '', '-arm' ]
      fail-fast: false
    needs: [ build_rpm ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Arch
        run: echo "ARCH=$(uname -m)" >> $GITHUB_ENV

      - name: Get deb arch
        run: |
          if [ "${{ env.ARCH }}" = "x86_64" ]; then
            echo "DEB_ARCH=amd64" >> $GITHUB_ENV
          elif [ "$ARCH" = "aarch64" ]; then
            echo "DEB_ARCH=arm64" >> $GITHUB_ENV
          else
            echo "DEB_ARCH=${{ env.ARCH }}" >> $GITHUB_ENV
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: |
            aikido-php-firewall.${{ env.ARCH }}.rpm

      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          echo "Etc/UTC" > /etc/timezone
          DEBIAN_FRONTEND=noninteractive dpkg-reconfigure -f noninteractive tzdata
          apt-get install -y alien

      - name: Get Aikido version
        run: |
          AIKIDO_VERSION=$(grep '#define PHP_AIKIDO_VERSION' lib/php-extension/include/php_aikido.h | awk -F'"' '{print $2}')
          echo $AIKIDO_VERSION
          echo "AIKIDO_VERSION=$AIKIDO_VERSION" >> $GITHUB_ENV
          echo "AIKIDO_RPM=aikido-php-firewall.${{ env.ARCH }}.rpm" >> $GITHUB_ENV
          echo "AIKIDO_ARTIFACT=aikido-php-firewall.${{ env.ARCH }}.deb" >> $GITHUB_ENV

      - name: Build deb
        run: |
          alien --to-deb --scripts --keep-version ${{ env.AIKIDO_RPM }}/${{ env.AIKIDO_RPM }}
          mv aikido-php-firewall_${{ env.AIKIDO_VERSION }}-1_${{ env.DEB_ARCH }}.deb temp-${{ env.AIKIDO_ARTIFACT }}

          # Package contents into deb with gzip compression (because default zstd compression is not supported by older versions of dpkg)
          mkdir deb-temp
          dpkg-deb -R temp-${{ env.AIKIDO_ARTIFACT }} deb-temp/
          dpkg-deb -Zgzip -b deb-temp ${{ env.AIKIDO_ARTIFACT }}
          rm -rf deb-temp

      - name: Archive deb package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AIKIDO_ARTIFACT }}
          if-no-files-found: error
          path: |
            ${{ env.AIKIDO_ARTIFACT }}

  build_alpine_libs:
    name: Build Alpine Go libs ${{ matrix.package_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            package_arch: x86_64
          - runner: ubuntu-24.04-arm
            package_arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test musl Go libraries
        run: |
          mkdir -p build
          docker run --rm \
            -v "${PWD}:/source" \
            -w /source \
            ghcr.io/aikidosec/firewall-php-build-libs-alpine:v1 sh -ec '
              cd lib
              protoc --go_out=agent --go-grpc_out=agent ipc.proto
              cd agent
              go mod download
              go mod verify
              go test -ldflags "-linkmode=external" ./...
              go build -buildvcs=false -ldflags "-s -w -linkmode=external" \
                -o ../../build/aikido-agent

              cd ..
              protoc --go_out=request-processor --go-grpc_out=request-processor ipc.proto
              cd request-processor
              go mod download
              go mod verify
              go test -ldflags "-linkmode=external" ./...
              go build -buildvcs=false -ldflags "-s -w -linkmode=external" \
                -buildmode=c-shared \
                -o ../../build/aikido-request-processor.so

              cd ../..
              cc tools/dlopen-smoke.c -ldl -o /tmp/dlopen-smoke
              /tmp/dlopen-smoke build/aikido-request-processor.so
              file build/aikido-agent build/aikido-request-processor.so
              go version
              go version -m build/aikido-agent
              go version -m build/aikido-request-processor.so
            '

      - name: Archive musl Go libraries
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: aikido-alpine-libs-${{ matrix.package_arch }}
          if-no-files-found: error
          path: |
            build/aikido-agent
            build/aikido-request-processor.so

  build_alpine_extension:
    name: Build Alpine PHP ${{ matrix.php_version }} ${{ matrix.zts == 1 && 'ZTS' || 'NTS' }} ${{ matrix.package_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        zts: [0, 1]
        package_arch: [x86_64, aarch64]
        include:
          - package_arch: x86_64
            runner: ubuntu-24.04
          - package_arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Select official PHP image
        run: |
          if [ "${{ matrix.zts }}" = "1" ]; then
            echo "EXTENSION_ABI=zts" >> "$GITHUB_ENV"
            echo "PHP_IMAGE=php:${{ matrix.php_version }}-zts-alpine" >> "$GITHUB_ENV"
          else
            echo "EXTENSION_ABI=nts" >> "$GITHUB_ENV"
            echo "PHP_IMAGE=php:${{ matrix.php_version }}-fpm-alpine" >> "$GITHUB_ENV"
          fi

      - name: Build and load extension
        run: |
          mkdir -p out
          docker run --rm \
            -e EXTENSION_ABI \
            -e PHP_VERSION="${{ matrix.php_version }}" \
            -v "${PWD}:/source:ro" \
            -v "${PWD}/out:/out" \
            "${PHP_IMAGE}" sh -ec '
              apk add --no-cache $PHPIZE_DEPS curl-dev linux-headers
              cp -a /source/. /tmp/work
              cd /tmp/work/lib/php-extension
              phpize
              mkdir -p /tmp/build
              cd /tmp/build
              CXX=g++ \
              CXXFLAGS="-fPIC -g -O2 -I/tmp/work/lib/php-extension/include" \
              LDFLAGS="-lstdc++" \
                /tmp/work/lib/php-extension/configure
              make -j"$(nproc)"

              OUTPUT="/out/aikido-extension-php-${PHP_VERSION}-${EXTENSION_ABI}.so"
              cp modules/aikido.so "${OUTPUT}"
              file "${OUTPUT}"
              php -n -d extension="${OUTPUT}" -m | grep -qx aikido

              if [ "${EXTENSION_ABI}" = "zts" ]; then
                php -v | grep -q ZTS
              else
                ! php -v | grep -q ZTS
                php-fpm -v
              fi
            '

      - name: Archive extension
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: aikido-alpine-extension-${{ matrix.php_version }}-${{ env.EXTENSION_ABI }}-${{ matrix.package_arch }}
          if-no-files-found: error
          path: out/aikido-extension-php-${{ matrix.php_version }}-${{ env.EXTENSION_ABI }}.so

  build_apk:
    name: Build APK ${{ matrix.package_arch }}
    needs: [build_alpine_libs, build_alpine_extension]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            package_arch: x86_64
          - runner: ubuntu-24.04-arm
            package_arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Get Aikido version
        run: |
          AIKIDO_VERSION=$(grep '#define PHP_AIKIDO_VERSION' lib/php-extension/include/php_aikido.h | awk -F'"' '{print $2}')
          echo "$AIKIDO_VERSION"
          echo "AIKIDO_VERSION=$AIKIDO_VERSION" >> "$GITHUB_ENV"
          echo "AIKIDO_LIBZEN_VERSION=0.1.64" >> "$GITHUB_ENV"

      - name: Download musl Go libraries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: aikido-alpine-libs-${{ matrix.package_arch }}
          path: package-input

      - name: Download PHP extensions
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: aikido-alpine-extension-*-${{ matrix.package_arch }}
          merge-multiple: true
          path: package-input

      - name: Download and verify musl Zen Internals
        run: |
          ZEN_FILE="libzen_internals_${{ matrix.package_arch }}-unknown-linux-musl.so"
          EXPECTED_SHA256=$(curl --fail --silent --show-error \
            "https://api.github.com/repos/AikidoSec/zen-internals/releases/tags/v${AIKIDO_LIBZEN_VERSION}" \
            | jq -r --arg name "${ZEN_FILE}" \
              '.assets[] | select(.name == $name) | .digest' \
            | sed 's/sha256://')
          test -n "${EXPECTED_SHA256}" && test "${EXPECTED_SHA256}" != "null"
          curl --fail --location --retry 3 \
            --output package-input/libzen-internals.so \
            "https://github.com/AikidoSec/zen-internals/releases/download/v${AIKIDO_LIBZEN_VERSION}/${ZEN_FILE}"
          echo "${EXPECTED_SHA256}  package-input/libzen-internals.so" | sha256sum -c -

      - name: Build APK
        run: |
          APK_NAME="aikido-php-firewall.${{ matrix.package_arch }}.apk"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          docker build \
            --file .github/workflows/Dockerfile.package-alpine \
            --build-context package-input=package-input \
            --target artifact \
            --build-arg APK_ARCH=${{ matrix.package_arch }} \
            --build-arg APK_OUTPUT=${APK_NAME} \
            --output type=local,dest=out \
            .

      - name: Archive APK
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ${{ env.APK_NAME }}
          if-no-files-found: error
          path: out/${{ env.APK_NAME }}

  test_apk_alpine_versions:
    name: Alpine ${{ matrix.alpine_version }} APK lifecycle ${{ matrix.package_arch }}
    needs: [build_apk]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        alpine_version: ['3.20', '3.21', '3.22', '3.23', '3.24']
        package_arch: [x86_64, aarch64]
        include:
          - package_arch: x86_64
            runner: ubuntu-24.04
          - package_arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Select repository PHP
        run: |
          case "${{ matrix.alpine_version }}" in
            3.20) PHP_SUFFIX=83 ;;
            3.21|3.22) PHP_SUFFIX=84 ;;
            3.23|3.24) PHP_SUFFIX=85 ;;
          esac
          AIKIDO_VERSION=$(awk -F= '/^pkgver=/ { print $2 }' package/apk/APKBUILD)
          {
            echo "PHP_SUFFIX=${PHP_SUFFIX}"
            echo "APK_NAME=aikido-php-firewall.${{ matrix.package_arch }}.apk"
            echo "AIKIDO_VERSION=${AIKIDO_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Download APK
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: aikido-php-firewall.${{ matrix.package_arch }}.apk
          path: package-input

      # This complements the full PHP/SAPI matrix below by checking that the APK
      # integrates with the native package layout of each supported Alpine line.
      - name: Verify APK install, CLI/CGI load, and removal
        run: |
          docker run --rm --privileged \
            -e AIKIDO_LOG_LEVEL=ERROR \
            -e AIKIDO_VERSION \
            -e APK_NAME \
            -e PHP_SUFFIX \
            -v "${PWD}:/work:ro" \
            "alpine:${{ matrix.alpine_version }}" sh -ec '
              apk add --no-cache \
                "php${PHP_SUFFIX}" \
                "php${PHP_SUFFIX}-cgi"

              apk add --allow-untrusted "/work/package-input/${APK_NAME}"
              "php${PHP_SUFFIX}" -m | grep -qx aikido
              "php-cgi${PHP_SUFFIX}" -m | grep -qx aikido
              test -L "/usr/lib/php${PHP_SUFFIX}/modules/aikido-${AIKIDO_VERSION}.so"
              test -L "/etc/php${PHP_SUFFIX}/conf.d/zz-aikido-${AIKIDO_VERSION}.ini"

              apk del aikido-php-firewall
              test ! -e "/usr/lib/php${PHP_SUFFIX}/modules/aikido-${AIKIDO_VERSION}.so"
              test ! -e "/etc/php${PHP_SUFFIX}/conf.d/zz-aikido-${AIKIDO_VERSION}.ini"
              test ! -e "/run/aikido-${AIKIDO_VERSION}"
              test ! -e "/var/log/aikido-${AIKIDO_VERSION}"
            '

  test_php_alpine_sapis:
    name: Alpine ${{ matrix.abi }} php-${{ matrix.php_version }} ${{ matrix.server }} ${{ matrix.arch == '' && 'x86_64' || 'arm' }}
    needs: [build_apk]
    permissions: { actions: read, contents: read, packages: read }
    runs-on: ubuntu-24.04${{ matrix.arch }}
    env:
      TEST_IMAGE: ghcr.io/aikidosec/firewall-php-test-alpine-${{ matrix.abi }}:${{ matrix.php_version }}-v1
    strategy:
      fail-fast: false
      matrix:
        abi: [nts, zts]
        php_version: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        server: [nginx-php-fpm, apache-mod-php, php-built-in]
        arch: ['', '-arm']
        exclude:
          - abi: zts
            server: apache-mod-php

    # JavaScript actions run on Ubuntu because Alpine ARM job containers do not
    # support them. The PHP tests still run inside the Alpine image.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Get package details
        run: |
          ARCH=$(uname -m)
          echo "APK_NAME=aikido-php-firewall.${ARCH}.apk" >> "$GITHUB_ENV"
          AIKIDO_VERSION=$(awk -F= '/^pkgver=/ { print $2 }' package/apk/APKBUILD)
          echo "AIKIDO_VERSION=${AIKIDO_VERSION}" >> "$GITHUB_ENV"

      - name: Download APK
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: ${{ env.APK_NAME }}
          path: package-input

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Alpine PHP tests
        env:
          ABI: ${{ matrix.abi }}
          EXPECTED_PHP_VERSION: ${{ matrix.php_version }}
          SERVER: ${{ matrix.server }}
        run: |
          docker run --rm --privileged --interactive \
            --env ABI \
            --env AIKIDO_VERSION \
            --env APK_NAME \
            --env EXPECTED_PHP_VERSION \
            --env SERVER \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work \
            "${TEST_IMAGE}" bash -euo pipefail <<'BASH'
              test "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "${EXPECTED_PHP_VERSION}"
              PHP_INFO="$(php -v)"
              printf "%s\n" "${PHP_INFO}"
              if [ "${ABI}" = "zts" ]; then
                grep -q ZTS <<< "${PHP_INFO}"
              else
                ! grep -q ZTS <<< "${PHP_INFO}"
              fi

              start-mariadb >/tmp/mariadb.log 2>&1 &
              MARIADB_READY=0
              for _ in $(seq 1 30); do
                if mysql -h 127.0.0.1 -u root -ppwd -e "SELECT 1"; then
                  MARIADB_READY=1
                  break
                fi
                sleep 1
              done
              if [ "${MARIADB_READY}" -ne 1 ]; then
                cat /tmp/mariadb.log
                exit 1
              fi

              start-postgres
              PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d zen_test -c "SELECT 1"
              apk add --allow-untrusted "package-input/${APK_NAME}"

              export TEST_PHP_EXECUTABLE=/usr/local/bin/php
              export TEST_PHP_CGI_EXECUTABLE=/usr/local/bin/php-cgi
              cd lib/php-extension
              phpize
              cd ../..
              php lib/php-extension/run-tests.php ./tests/cli

              cd tools
              python3 run_server_tests.py ../tests/server ../tests/testlib \
                --server="${SERVER}" --max-runs=3
              cd ..

              if [ "${SERVER}" = "php-built-in" ]; then
                EXTENSION_DIR=$(php -r 'echo ini_get("extension_dir");')
                apk del aikido-php-firewall
                test ! -e "${EXTENSION_DIR}/aikido-${AIKIDO_VERSION}.so"
                test ! -e "/usr/local/etc/php/conf.d/zz-aikido-${AIKIDO_VERSION}.ini"
                test ! -e "/run/aikido-${AIKIDO_VERSION}"
                test ! -e "/var/log/aikido-${AIKIDO_VERSION}"
              fi
          BASH

  test_php_frankenphp_alpine:
    name: Alpine FrankenPHP php-${{ matrix.php_version }} ${{ matrix.server }} ${{ matrix.arch == '' && 'x86_64' || 'arm' }}
    needs: [build_apk]
