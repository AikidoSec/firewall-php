          if [ "${MARIADB_READY}" -ne 1 ]; then
            cat /tmp/mariadb.log
            exit 1
          fi

      - name: Start PostgreSQL (background)
        run: |
          start-postgres   # provided by the image
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 5432 -U postgres -d zen_test -c "SELECT 1" || (echo "PostgreSQL not up" && exit 1)

      - name: Install DEB
        run: |
          dpkg -i -E ${{ env.AIKIDO_DEB }}/${{ env.AIKIDO_DEB }}

      - name: Run CLI tests
        run: |
          export TEST_PHP_EXECUTABLE=/usr/local/bin/php
          cd lib/php-extension/
          phpize
          cd ../../
          php lib/php-extension/run-tests.php ./tests/cli

      - name: Run ${{ matrix.server }} server tests
        run: |
          . /etc/apache2/envvars
          cd tools
          python3 run_server_tests.py ../tests/server ../tests/testlib --server=${{ matrix.server }} --max-runs=3

