name: Build Alpine PHP test images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/Dockerfile.alpine-php-test
      - .github/workflows/build-alpine-php-test-images.yml

env:
  REGISTRY: ghcr.io
  VERSION: v1

jobs:
  build-amd64:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php_version: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        abi: [nts, zts]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Prepare FrankenPHP binary directory
        run: mkdir -p frankenphp-binary
      - name: Extract FrankenPHP from its Alpine image
        if: matrix.abi == 'zts' && matrix.php_version >= '8.2'
        run: |
          docker pull --platform linux/amd64 dunglas/frankenphp:php${{ matrix.php_version }}-alpine
          docker create --platform linux/amd64 --name temp-frankenphp dunglas/frankenphp:php${{ matrix.php_version }}-alpine
          docker cp temp-frankenphp:/usr/local/bin/frankenphp frankenphp-binary/frankenphp
          docker cp -L temp-frankenphp:/usr/local/lib/libwatcher-c.so.0 frankenphp-binary/libwatcher-c.so.0
          docker rm temp-frankenphp
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: .github/workflows/Dockerfile.alpine-php-test
          platforms: linux/amd64
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            PHP_ZTS=${{ matrix.abi == 'zts' && '1' || '0' }}
          tags: ${{ env.REGISTRY }}/aikidosec/firewall-php-test-alpine-${{ matrix.abi }}:${{ matrix.php_version }}-amd64-${{ env.VERSION }}

  build-arm64:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        php_version: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        abi: [nts, zts]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Prepare FrankenPHP binary directory
        run: mkdir -p frankenphp-binary
      - name: Extract FrankenPHP from its Alpine image
        if: matrix.abi == 'zts' && matrix.php_version >= '8.2'
        run: |
          docker pull --platform linux/arm64 dunglas/frankenphp:php${{ matrix.php_version }}-alpine
          docker create --platform linux/arm64 --name temp-frankenphp dunglas/frankenphp:php${{ matrix.php_version }}-alpine
          docker cp temp-frankenphp:/usr/local/bin/frankenphp frankenphp-binary/frankenphp
          docker cp -L temp-frankenphp:/usr/local/lib/libwatcher-c.so.0 frankenphp-binary/libwatcher-c.so.0
          docker rm temp-frankenphp
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: .github/workflows/Dockerfile.alpine-php-test
          platforms: linux/arm64
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            PHP_ZTS=${{ matrix.abi == 'zts' && '1' || '0' }}
          tags: ${{ env.REGISTRY }}/aikidosec/firewall-php-test-alpine-${{ matrix.abi }}:${{ matrix.php_version }}-arm64-${{ env.VERSION }}

  publish-manifests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64]
    strategy:
      fail-fast: false
      matrix:
        php_version: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        abi: [nts, zts]
    permissions: { contents: read, packages: write }
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          IMAGE=${{ env.REGISTRY }}/aikidosec/firewall-php-test-alpine-${{ matrix.abi }}
          PHP_VERSION=${{ matrix.php_version }}
          docker buildx imagetools create \
            --tag ${IMAGE}:${PHP_VERSION}-${{ env.VERSION }} \
            ${IMAGE}:${PHP_VERSION}-amd64-${{ env.VERSION }} \
            ${IMAGE}:${PHP_VERSION}-arm64-${{ env.VERSION }}
